<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whiteboard App - Professional Drawing Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>✏️ Whiteboard Studio</h1>
            <p class="subtitle">Professional Drawing Tool</p>
        </div>
        
        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Sidebar Toolbar -->
            <div class="sidebar">
                <!-- Drawing Tools Section -->
                <div class="tool-section">
                    <h3 class="section-title">Tools</h3>
                    <div class="button-group">
                        <button id="drawBtn" class="btn btn-tool active" title="Freehand Draw (D)">✏️ Draw</button>
                        <button id="eraserBtn" class="btn btn-tool" title="Eraser (E)">🧹 Eraser</button>
                    </div>
                    <div class="button-group">
                        <button id="rectBtn" class="btn btn-tool" title="Rectangle (R)">▭</button>
                        <button id="circleBtn" class="btn btn-tool" title="Circle (C)">●</button>
                        <button id="lineBtn" class="btn btn-tool" title="Line (L)">/</button>
                        <button id="triangleBtn" class="btn btn-tool" title="Triangle (T)">△</button>
                    </div>
                    <div class="button-group">
                        <button id="textBtn" class="btn btn-tool" title="Text">A</button>
                        <button id="fillBtn" class="btn btn-tool" title="Fill">💧</button>
                    </div>
                </div>

                <!-- History Section -->
                <div class="tool-section">
                    <h3 class="section-title">History</h3>
                    <div class="button-group">
                        <button id="undoBtn" class="btn btn-secondary full-width" title="Undo (Ctrl+Z)">↶ Undo</button>
                        <button id="redoBtn" class="btn btn-secondary full-width" title="Redo (Ctrl+Y)">↷ Redo</button>
                    </div>
                </div>

                <!-- Color & Opacity Section -->
                <div class="tool-section">
                    <h3 class="section-title">Color</h3>
                    <div class="color-picker-wrapper">
                        <input type="color" id="colorPicker" value="#000000">
                    </div>
                    <div id="colorHistory" class="color-history"></div>
                </div>

                <!-- Settings Section -->
                <div class="tool-section">
                    <h3 class="section-title">Settings</h3>
                    <div class="setting-item">
                        <label for="brushSize">Brush:</label>
                        <div class="slider-wrapper">
                            <input type="range" id="brushSize" min="1" max="50" value="3">
                            <span id="brushSizeValue">3</span>px
                        </div>
                    </div>
                    <div class="setting-item">
                        <label for="opacity">Opacity:</label>
                        <div class="slider-wrapper">
                            <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="1">
                            <span id="opacityValue">100</span>%
                        </div>
                    </div>
                    <div class="setting-item">
                        <label for="brushStyle">Style:</label>
                        <select id="brushStyle">
                            <option value="smooth">Smooth</option>
                            <option value="sketch">Sketch</option>
                            <option value="rough">Rough</option>
                        </select>
                    </div>
                </div>

                <!-- View Section -->
                <div class="tool-section">
                    <h3 class="section-title">View</h3>
                    <div class="button-group">
                        <button id="gridToggleBtn" class="btn btn-info" title="Toggle Grid">▦ Grid</button>
                        <button id="darkModeBtn" class="btn btn-info" title="Dark Mode">🌙</button>
                    </div>
                </div>

                <!-- Canvas Size Section -->
                <div class="tool-section">
                    <h3 class="section-title">Canvas</h3>
                    <div class="setting-item">
                        <label>Width:</label>
                        <input type="number" id="canvasWidth" value="1000" min="400" max="2000" step="100">
                    </div>
                    <div class="setting-item">
                        <label>Height:</label>
                        <input type="number" id="canvasHeight" value="600" min="300" max="1500" step="100">
                    </div>
                    <button id="resizeCanvasBtn" class="btn btn-secondary full-width">Apply Size</button>
                </div>

                <!-- Zoom Section -->
                <div class="tool-section">
                    <h3 class="section-title">Zoom</h3>
                    <div class="zoom-controls">
                        <button id="zoomOutBtn" class="btn btn-sm">−</button>
                        <span id="zoomLevel">100%</span>
                        <button id="zoomInBtn" class="btn btn-sm">+</button>
                    </div>
                </div>
            </div>

            <!-- Canvas Area -->
            <div class="canvas-area">
                <div class="canvas-header">
                    <span>Canvas</span>
                </div>
                <div class="canvas-wrapper">
                    <div class="canvas-frame">
                        <canvas id="canvas"></canvas>
                    </div>
                </div>
                
                <!-- Bottom Status Bar -->
                <div class="status-bar">
                    <span id="statusText">Ready to draw</span>
                </div>
            </div>
        </div>

        <!-- Footer Toolbar -->
        <div class="footer-toolbar">
            <button id="saveLocalBtn" class="btn btn-success" title="Save locally (Ctrl+S)">💾 Save</button>
            <button id="loadLocalBtn" class="btn btn-success" title="Load drawing">📂 Load</button>
            <button id="downloadPngBtn" class="btn btn-info" title="Download as PNG">⬇ PNG</button>
            <button id="downloadSvgBtn" class="btn btn-info" title="Download as SVG">⬇ SVG</button>
            <button id="clearBtn" class="btn btn-danger" title="Clear entire canvas">🗑 Clear</button>
        </div>

        <!-- Text Input Modal -->
        <div id="textModal" class="modal hidden">
            <div class="modal-content">
                <h3>Add Text</h3>
                <input type="text" id="textInput" placeholder="Enter text..." maxlength="200">
                <div class="modal-setting">
                    <label for="textSize">Font Size:</label>
                    <div class="slider-wrapper">
                        <input type="range" id="textSize" min="8" max="72" value="24">
                        <span id="textSizeValue">24</span>px
                    </div>
                </div>
                <div class="modal-buttons">
                    <button id="textConfirmBtn" class="btn btn-primary">Add</button>
                    <button id="textCancelBtn" class="btn btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>

</body>
</html>
